<!DOCTYPE html>
<html lang="pt-BR">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="SPECTRE é uma marca de roupas oversized e minimalistas criada por jovens que uniram design e desenvolvimento para lançar um projeto completo e promissor.">
        <meta name="keywords" content="oversized, estilo-jovem, streatwear">
        <meta name="author" content="Nícolas de Oliveira Ferreira, Vinicius Luiz Gomes de Lima">
        <title>SPECTRE-PRODUTOS</title>
        <link rel="icon" type="image/png" href="img/favicon-32x32.png">
        <link rel="stylesheet" href="css/style.min.css">
        <link rel="stylesheet" href="css/componentes.min.css">
        <link rel="stylesheet" href="css/responsive.min.css">
        
        <script src="js/componentes.min.js" defer></script>
    </head>

    <body>
        <div id="header-container"></div>

        <main class="conteudo">
            <section class="modelos">
                <h3><br>FILTRAR</h3>
                <hr class="linha">
                
                <h3>OFERTAS EM DESTAQUES</h3>
                <div class="camisas-sem-modelo">
                    <img src="img/camisa.svg" alt="camiseta oversized">
                    <img src="img/camisa.svg" alt="camiseta oversized">
                    <img src="img/camisa.svg" alt="camiseta oversized">
                    <hr class="linha">
                </div>

                <h3>CONFIRA NOSSOS PRODUTOS EM DETALHE</h3>
                <div class="camisas-com-modelo">
                    <img src="img/primeiroModelo.svg" alt="modelo">
                    <img src="img/segundoModelo.svg" alt="modelo">
                    <img src="img/terceiroModelo.svg" alt="modelo">
                </div>
            </section>
        </main>
        <div id="footer-container"></div>

        <script>
            const imagens = document.querySelectorAll(".camisas-sem-modelo img, .camisas-com-modelo img");

            imagens.forEach(imagem => {
                imagem.onmouseover = function() {
                    imagem.style.transform = "scale(1.04)";
                    imagem.style.transition = "0.3s";
                };
                imagem.onmouseout = function() {
                    imagem.style.transform = "scale(1)";
                };
            });
        </script>
    </body>
</html>
