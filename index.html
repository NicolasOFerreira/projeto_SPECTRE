<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SPECTRE</title>
        
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/componentes.css">
        <link rel="stylesheet" href="css/responsive.css">
        
        <script src="js/componentes.js" defer></script>
    </head>

    <body>
        <div id="header-container"></div> 
        
        <main class="imagem-principal">
            <img id="fotoDestaque" src="img/fotoPrincipalPaginaInicial.svg" alt="modelos utilizando SPECTRE">
        </main>

        <div id="footer-container"></div>

        <script>
            if (!localStorage.getItem("nomeUsuario")) {
                let nome = prompt("Digite seu nome para continuar:");
                if (nome) {
                    localStorage.setItem("nomeUsuario", nome);
                }
            }
        </script>
    </body>
</html>
